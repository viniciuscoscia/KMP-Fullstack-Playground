server:
  address: 127.0.0.1

spring:
  datasource:
    url: jdbc:h2:mem:substance_atlas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration/common
  jpa:
    hibernate:
      ddl-auto: validate
  ai:
    mcp:
      server:
        enabled: false

substance-atlas:
  security:
    admin-token: test-admin-token
  research:
    live-enabled: false
    fixed-delay: 3600000
  reporting:
    template-path: build/test-missing-template.xlsx
