openapi: 3.1.0
info:
  title: Substance Atlas API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8080
paths:
  /api/v1/dashboard:
    get:
      operationId: getDashboard
      responses:
        '200':
          description: Approved catalog metrics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dashboard'}
  /api/v1/products:
    get:
      operationId: listProducts
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {name: query, in: query, schema: {type: string, maxLength: 120}}
      responses:
        '200': {description: Products, content: {application/json: {schema: {$ref: '#/components/schemas/ProductPage'}}}}
  /api/v1/products/{id}:
    get:
      operationId: getProduct
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Product, content: {application/json: {schema: {$ref: '#/components/schemas/Product'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/substances:
    get:
      operationId: listSubstances
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
        - {name: query, in: query, schema: {type: string, maxLength: 120}}
        - {name: tags, in: query, schema: {type: array, items: {type: string}}}
      responses:
        '200': {description: Substances, content: {application/json: {schema: {$ref: '#/components/schemas/SubstancePage'}}}}
  /api/v1/substances/{id}:
    get:
      operationId: getSubstance
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Substance detail, content: {application/json: {schema: {$ref: '#/components/schemas/Substance'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /api/v1/substances/compare:
    get:
      operationId: compareSubstances
      parameters:
        - {name: ids, in: query, required: true, schema: {type: array, minItems: 2, maxItems: 5, items: {type: string, format: uuid}}}
        - {name: indicationId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Comparison, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Substance'}}}}}
  /api/v1/tags:
    get:
      operationId: listTags
      responses: {'200': {description: Controlled taxonomy}}
  /api/v1/sources:
    get:
      operationId: listSources
      responses: {'200': {description: Citation metadata}}
  /api/v1/research-jobs:
    post:
      operationId: createResearchJob
      security: [{bearerAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 120}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateResearchJob'}
      responses:
        '202': {description: Accepted, content: {application/json: {schema: {$ref: '#/components/schemas/ResearchJob'}}}}
        '400': {$ref: '#/components/responses/Problem'}
  /api/v1/research-jobs/{id}:
    get:
      operationId: getResearchJob
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Job state, content: {application/json: {schema: {$ref: '#/components/schemas/ResearchJob'}}}}
  /api/v1/drafts/{id}:
    get:
      operationId: getDraft
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: Draft revision}}
  /api/v1/drafts/{id}/approve:
    post:
      operationId: approveDraft
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: Published revision}}
  /api/v1/drafts/{id}/reject:
    post:
      operationId: rejectDraft
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses: {'200': {description: Rejected revision}}
  /api/v1/reports/analytics.xlsx:
    get:
      operationId: downloadAnalyticsWorkbook
      responses:
        '200': {description: Analytics workbook, content: {application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}}}
        '503': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
    Size: {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
  responses:
    Problem:
      description: RFC 9457 problem
      content: {application/problem+json: {schema: {type: object}}}
  schemas:
    Dashboard:
      type: object
      required: [productCount, substanceCount, sourceCoveragePercent, highRiskCount, reviewQueueCount]
      properties:
        productCount: {type: integer}
        substanceCount: {type: integer}
        sourceCoveragePercent: {type: number}
        highRiskCount: {type: integer}
        reviewQueueCount: {type: integer}
    Product:
      type: object
      required: [id, name, brand, substances, capturedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        brand: {type: string}
        storeCategory: {type: [string, 'null']}
        observedPrice: {type: [number, 'null']}
        currency: {type: [string, 'null']}
        listingUrl: {type: [string, 'null'], format: uri}
        capturedAt: {type: string, format: date-time}
        substances: {type: array, items: {$ref: '#/components/schemas/SubstanceSummary'}}
    SubstanceSummary:
      type: object
      required: [id, name, description, tags, evidenceLevel, reviewStatus]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        tags: {type: array, items: {type: string}}
        efficacyScore: {type: [integer, 'null'], minimum: 0, maximum: 10}
        riskScore: {type: [integer, 'null'], minimum: 0, maximum: 10}
        evidenceLevel: {enum: [HIGH, MODERATE, LOW, VERY_LOW, INSUFFICIENT]}
        reviewStatus: {enum: [DRAFT, IN_REVIEW, APPROVED, REJECTED]}
    Substance:
      allOf:
        - {$ref: '#/components/schemas/SubstanceSummary'}
        - type: object
          properties:
            aliases: {type: array, items: {type: string}}
            indications: {type: array, items: {$ref: '#/components/schemas/IndicationAssessment'}}
            riskProfile: {$ref: '#/components/schemas/RiskProfile'}
            evidence: {type: array, items: {$ref: '#/components/schemas/EvidenceClaim'}}
    IndicationAssessment:
      type: object
      required: [id, indication, population, outcome, evidenceLevel, rationale]
      properties:
        id: {type: string, format: uuid}
        indication: {type: string}
        population: {type: string}
        outcome: {type: string}
        efficacyScore: {type: [integer, 'null'], minimum: 0, maximum: 10}
        evidenceLevel: {enum: [HIGH, MODERATE, LOW, VERY_LOW, INSUFFICIENT]}
        rationale: {type: string}
    RiskProfile:
      type: object
      required: [context, rationale]
      properties:
        context: {type: string}
        overallScore: {type: [integer, 'null'], minimum: 0, maximum: 10}
        commonBurden: {type: [integer, 'null'], minimum: 0, maximum: 10}
        severeAcute: {type: [integer, 'null'], minimum: 0, maximum: 10}
        chronicOrgan: {type: [integer, 'null'], minimum: 0, maximum: 10}
        dependency: {type: [integer, 'null'], minimum: 0, maximum: 10}
        interaction: {type: [integer, 'null'], minimum: 0, maximum: 10}
        productQuality: {type: [integer, 'null'], minimum: 0, maximum: 10}
        regulatoryUncertainty: {type: [integer, 'null'], minimum: 0, maximum: 10}
        rationale: {type: string}
    EvidenceClaim:
      type: object
      required: [id, claim, sources]
      properties:
        id: {type: string, format: uuid}
        claim: {type: string}
        sources: {type: array, minItems: 1, items: {type: string, format: uuid}}
    CreateResearchJob:
      type: object
      required: [terms, locale]
      properties:
        terms: {type: array, minItems: 1, maxItems: 100, items: {type: string, minLength: 2, maxLength: 160}}
        locale: {enum: [pt-BR, en]}
    ResearchJob:
      type: object
      required: [id, status, items, createdAt]
      properties:
        id: {type: string, format: uuid}
        status: {enum: [QUEUED, RUNNING, PARTIAL, NEEDS_INPUT, COMPLETED, FAILED]}
        items: {type: array, items: {type: object}}
        createdAt: {type: string, format: date-time}
    ProductPage:
      type: object
      properties: {items: {type: array, items: {$ref: '#/components/schemas/Product'}}, page: {type: integer}, size: {type: integer}, total: {type: integer}}
    SubstancePage:
      type: object
      properties: {items: {type: array, items: {$ref: '#/components/schemas/SubstanceSummary'}}, page: {type: integer}, size: {type: integer}, total: {type: integer}}
