name: substance-atlas

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: substance_atlas
      POSTGRES_USER: substance_atlas
      POSTGRES_PASSWORD: substance_atlas_local
    ports:
      - "127.0.0.1:${SUBSTANCE_ATLAS_POSTGRES_PORT:-15432}:5432"
    volumes:
      - substance-atlas-postgres18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U substance_atlas -d substance_atlas"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [substance-atlas]

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/substance_atlas
      SPRING_DATASOURCE_USERNAME: substance_atlas
      SPRING_DATASOURCE_PASSWORD: substance_atlas_local
      LOCAL_ADMIN_TOKEN: ${LOCAL_ADMIN_TOKEN:-local-development-token-change-me}
      SUBSTANCE_ATLAS_IMPORT_ENABLED: "true"
      SUBSTANCE_ATLAS_IMPORT_SOURCE_PATH: /opt/substance-atlas/import/marketplace.txt
      ANALYTICS_TEMPLATE_PATH: /opt/substance-atlas/templates/substance-atlas-dashboard.xlsx
    ports:
      - "127.0.0.1:${SUBSTANCE_ATLAS_SERVER_PORT:-18080}:8080"
    volumes:
      - type: bind
        source: ./.local/templates/substance-atlas-dashboard.xlsx
        target: /opt/substance-atlas/templates/substance-atlas-dashboard.xlsx
        read_only: true
      - type: bind
        source: ./.local/import/marketplace.txt
        target: /opt/substance-atlas/import/marketplace.txt
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [substance-atlas]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:${SUBSTANCE_ATLAS_WEB_PORT:-18081}:8081"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/ | grep -q 'webApp.js'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [substance-atlas]

networks:
  substance-atlas:
    internal: true

volumes:
  substance-atlas-postgres18:
